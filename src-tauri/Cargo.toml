[package]
name = "llm-model-searcher"
version = "0.0.1"
description = "Hugging Face LLM model search, recommendation and library manager"
license = "MIT"
repository = "https://github.com/Echos/LLMModelSearcher"
edition = "2021"

[lib]
name = "llm_model_searcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sysinfo = "0.37"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"
axum = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
